[package]
name = "lexmx-desktop"
version = "0.1.0"
description = "LexMX Escritorio: corpus completo y modelo local en disco (plan § 11.4 E)"
authors = ["LexMX"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lexmx_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
