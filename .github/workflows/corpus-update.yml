name: 📚 Corpus MX federal (import + embeddings + release)

# Fase 6 of docs/INCEPTOR-MIGRATION-ANALYSIS.md.
# Imports federal laws from LegalIA's `scjn-leyes` release (INGEOTEC, UNAM;
# Apache-2.0), embeds every content section with the same model the client
# uses (Xenova/multilingual-e5-small), and publishes the result as the
# `corpus-latest` GitHub Release. The Pages deploy downloads that asset before
# building, so the repo never carries the generated corpus and the site never
# waits on embeddings.

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Comma-separated LegalIA slugs (empty = curated default set)'
        required: false
        default: ''
      all:
        description: 'Import every federal law in the release (slow: hours of embeddings)'
        required: false
        default: false
        type: boolean
  schedule:
    # Sundays 02:00 UTC — LegalIA regenerates its release when the DOF publishes reforms.
    - cron: '0 2 * * 0'

permissions:
  contents: write

concurrency:
  group: corpus-update
  cancel-in-progress: false

jobs:
  build-corpus:
    name: Import, embed and publish
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Cache embedding model
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.0
        with:
          path: ~/.cache/lexmx-hf
          key: hf-multilingual-e5-small-v1

      - name: Import federal laws from LegalIA
        run: |
          set -euo pipefail
          mkdir -p build/corpus/legal-corpus build/corpus/embeddings
          if [ "${{ inputs.all }}" = "true" ]; then
            node --experimental-strip-types scripts/corpus/import-legalia.ts --all --out build/corpus/legal-corpus
          elif [ -n "${{ inputs.slugs }}" ]; then
            node --experimental-strip-types scripts/corpus/import-legalia.ts --slugs "${{ inputs.slugs }}" --out build/corpus/legal-corpus
          else
            node --experimental-strip-types scripts/corpus/import-legalia.ts --out build/corpus/legal-corpus
          fi

      - name: Build embeddings (same model as the client)
        run: node --experimental-strip-types scripts/corpus/build-embeddings.ts --corpus build/corpus/legal-corpus --out build/corpus/embeddings

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          DOCS=$(jq -r '.totalDocuments' build/corpus/legal-corpus/metadata.json)
          VECS=$(jq -r '.totalEmbeddings' build/corpus/embeddings/index.json)
          SRC=$(jq -r '.source.generado' build/corpus/legal-corpus/index.json)
          jq -n --arg docs "$DOCS" --arg vecs "$VECS" --arg src "$SRC" --arg sha "$GITHUB_SHA" \
            '{jurisdiction:"mx-federal", documents:($docs|tonumber), embeddings:($vecs|tonumber), legaliaGenerado:$src, builtFrom:$sha, builtAt:(now|todate), model:"Xenova/multilingual-e5-small"}' \
            > build/corpus/corpus-manifest.json
          tar -C build/corpus -czf corpus-mx-federal.tgz legal-corpus embeddings corpus-manifest.json
          ls -l corpus-mx-federal.tgz
          echo "docs=$DOCS" >> "$GITHUB_OUTPUT"
          echo "vecs=$VECS" >> "$GITHUB_OUTPUT"

      - name: Publish as release `corpus-latest`
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Corpus federal mexicano importado de LegalIA (INGEOTEC, UNAM; Apache-2.0) y embebido con Xenova/multilingual-e5-small.
          Documentos: ${{ steps.pkg.outputs.docs }} · Vectores: ${{ steps.pkg.outputs.vecs }} · Build: $GITHUB_SHA
          Los textos son documentos oficiales de la SCJN; el empaquetado y el historial de reformas los mantiene LegalIA."
          if gh release view corpus-latest >/dev/null 2>&1; then
            gh release upload corpus-latest corpus-mx-federal.tgz build/corpus/corpus-manifest.json --clobber
            gh release edit corpus-latest --notes "$NOTES"
          else
            gh release create corpus-latest corpus-mx-federal.tgz build/corpus/corpus-manifest.json \
              --title "Corpus MX federal (latest)" --notes "$NOTES" --prerelease
          fi
