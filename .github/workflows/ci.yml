name: CI

on:
  push:
    branches:
      - main
      - 'phase-*/**'
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'chore/**'
      - 'claude/**'
  pull_request:
    branches: [main]

# One run per branch: a new push cancels the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (ratchet + strict tsc + tests + lint + pragmas + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # `npm run check` = ratchet (tsc errors + `any` warnings may not grow),
      # strict tsc on the cleaned modules, vitest, eslint, ts-pragma gate,
      # then a full production build. See docs/INCEPTOR-MIGRATION-ANALYSIS.md § 5.
      - name: Check
        run: npm run check
        env:
          ASTRO_BASE: /LexMX
          PUBLIC_REPO_SLUG: ${{ vars.PUBLIC_REPO_SLUG || 'ArtemioPadilla/LexMX' }}

  actionlint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
